<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" fill="none">
  <!-- Monogram Outer Frame with Bottom Cut -->
  <path
    d="M 46 84 H 6 V 6 H 84 V 84 H 62"
    stroke="#001FB5"
    stroke-width="6"
    stroke-linecap="butt"
    stroke-linejoin="miter"
  />
  <!-- Upper Horizontal Bar -->
  <line
    x1="20"
    y1="24"
    x2="70"
    y2="24"
    stroke="#001FB5"
    stroke-width="6"
    stroke-linecap="butt"
  />
  <!-- Lower Horizontal Bar -->
  <line
    x1="20"
    y1="36"
    x2="70"
    y2="36"
    stroke="#001FB5"
    stroke-width="6"
    stroke-linecap="butt"
  />
  <!-- Left Vertical Stem (from lower bar down, stopping before bottom) -->
  <line
    x1="33"
    y1="36"
    x2="33"
    y2="72"
    stroke="#001FB5"
    stroke-width="6"
    stroke-linecap="butt"
  />
  <!-- Right Vertical Stem (from upper bar down to bottom border) -->
  <line
    x1="46"
    y1="24"
    x2="46"
    y2="84"
    stroke="#001FB5"
    stroke-width="6"
    stroke-linecap="butt"
  />
</svg>
